[project]
name = "secops-landscape-monitoring"
version = "0.1.0"
description = "Semi-automated SecOps startup and technology landscape monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
secops-discover = "scripts.discover:main"
secops-triage = "scripts.triage:main"
secops-validate-report = "scripts.validate_report:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
