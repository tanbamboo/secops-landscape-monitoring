name: Weekly Discovery

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# contents: write is enough to push a branch; no PR permission required.
permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run discovery
        run: python scripts/discover.py

      - name: Push inbox updates to branch
        env:
          BRANCH: discovery/weekly-inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topics/inbox.yaml
          if git diff --cached --quiet; then
            echo "No inbox changes — nothing to push."
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "chore: weekly discovery inbox update"
          git push --force-with-lease origin "$BRANCH"

          echo "Inbox updated on branch ${BRANCH}."
          echo "Open a PR: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
